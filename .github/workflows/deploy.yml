name: Deploy Test Site

# Manual only. Pushing to nyunt/dev-deploy no longer deploys on its own — run this
# workflow from the Actions tab ("Run workflow") when a deploy is actually wanted.
on:
  workflow_dispatch:

# Serialize deploys so two runs never push the Pages branch concurrently.
concurrency:
  group: deploy-test-site
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

env:
  PAGES_BRANCH: nyunt/dev-W7.1
  SITE_URL: https://ndcs-smartrpd.github.io/tmp.rpd/
  DOCS_BRANCH: dev-deploy-documentation

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Capture revision
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (deterministic, from lockfile)
        run: npm ci

      - name: Lint (errors gate; warnings pass)
        run: npm run lint

      - name: Test (fail-closed gate)
        # Runners are UTC. localDateFormatting.test.mjs asserts the local-vs-UTC
        # off-by-one it guards against, which only reproduces east of UTC — and
        # V8 caches the zone before a test body can set it, so it must be set
        # here, before Node starts.
        env:
          TZ: Asia/Singapore
        run: npm run test:ci

      - name: Archive coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

      - name: Build (production webpack)
        run: |
          npm run build
          test -f dist/bundle.js || { echo "❌ build produced no dist/bundle.js"; exit 1; }

      - name: Manifest (revision + digest)
        run: |
          CREATED=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          # -z/-0 keeps filenames with spaces (e.g. assets/instruction editor/) intact.
          DIGEST=$({ git ls-files -z; printf 'dist/bundle.js\0'; } | LC_ALL=C sort -zu | xargs -0 sha256sum | sha256sum | cut -d" " -f1)
          cat > manifest.json <<EOF
          {
            "app": "smartrpd",
            "revision": "${GITHUB_SHA}",
            "buildId": "${GITHUB_RUN_NUMBER}",
            "releaseId": "${GITHUB_SHA}-${GITHUB_RUN_NUMBER}",
            "digest": "sha256:${DIGEST}",
            "createdAt": "${CREATED}",
            "siteUrl": "${SITE_URL}",
            "ci": "github-actions"
          }
          EOF
          echo "🔒 Artifact digest: sha256:${DIGEST}"
          cat manifest.json

      - name: Checkout Pages branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PAGES_BRANCH }}
          path: .pages-branch

      - name: Deploy to Pages branch
        run: |
          # Replace branch content with exactly this verified revision + built bundle.
          # History is preserved — every previous deploy is one commit back for rollback.
          find .pages-branch -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          git archive "${GITHUB_SHA}" | tar -x -C .pages-branch
          mkdir -p .pages-branch/dist
          cp dist/bundle.js .pages-branch/dist/
          cp manifest.json .pages-branch/
          touch .pages-branch/.nojekyll
          cd .pages-branch
          test -f index.html || { echo "❌ deploy missing index.html"; exit 1; }
          git add -A
          if git diff --cached --quiet; then
            echo "ℹ️ Site already at ${GITHUB_SHA} — nothing to push"
          else
            git -c user.email='ci@smartrpd.local' -c user.name='SmartRPD CI' \
              commit -m "Deploy ${GITHUB_SHA} (run ${GITHUB_RUN_NUMBER})"
            git push origin "${PAGES_BRANCH}"
            echo "✅ Deployed to ${SITE_URL}"
          fi

      - name: Request Pages rebuild
        # Pushes made with GITHUB_TOKEN do not auto-trigger the legacy Pages build.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || echo "⚠️ Pages build request failed — a build may already be queued"

      # Event-driven replacement for deploy-review.yml's old cron (which can never fire —
      # GitHub only reads `schedule:` from the default branch, and this repo's default
      # branch is `main`, not this one). Refreshing right after a real deploy is more
      # accurate anyway: it checks docs-branch/live-branch alignment at the moment code
      # actually goes live, instead of guessing on a fixed weekly clock.
      - name: Checkout documentation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DOCS_BRANCH }}
          path: .docs-branch
          # Full history: the alignment check does `git merge-base --is-ancestor`,
          # which needs more than the default shallow (depth-1) checkout.
          fetch-depth: 0

      - name: Refresh documentation (deploy-review)
        working-directory: .docs-branch
        run: |
          npm ci
          node tools/deploy-review.mjs

      - name: Commit and push refreshed documentation
        working-directory: .docs-branch
        run: |
          git add "Documentations/AutoTest Results"
          if git diff --cached --quiet; then
            echo "ℹ️ No documentation changes to commit — data was already current."
          else
            git -c user.email='ci@smartrpd.local' -c user.name='SmartRPD CI' \
              commit -m "Doc refresh triggered by deploy ${GITHUB_SHA} (run ${GITHUB_RUN_NUMBER})"
            git push origin "HEAD:${DOCS_BRANCH}"
            echo "✅ Documentation refreshed on ${DOCS_BRANCH}"
          fi
